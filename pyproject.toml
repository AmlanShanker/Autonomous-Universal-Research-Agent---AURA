[project]
name = "aura"
version = "0.1.0"
description = "Autonomous Universal Research Agent — governed, evidence-driven research automation"
readme = "README.md"
authors = [
    { name = "Amlan Shanker", email = "amlanshanker2005@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "pymongo>=4.20.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
aura = "aura:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27.0",
]
